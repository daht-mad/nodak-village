<script>
// 흰 바탕 걷기: 가장자리에서 이어진 거의 흰 칸 + 위쪽 35% 안의 큰 흰 섬(열쇠고리 구멍)을 투명하게, 남은 것만 잘라 낸다
function cut(src){return new Promise(ok=>{const im=new Image();im.onload=()=>{
  const s=Math.min(1,1800/im.height),W=Math.round(im.width*s),H=Math.round(im.height*s);
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(im,0,0,W,H); /* 투명 그림은 흰 바탕에 먼저 얹는다 — 반투명 아크릴이 노란 판에 비치지 않게 */
  const d=x.getImageData(0,0,W,H),p=d.data,N=W*H,bg=new Uint8Array(N);
  const light=i=>{const r=p[i*4],g=p[i*4+1],b=p[i*4+2],mn=Math.min(r,g,b),mx=Math.max(r,g,b);return p[i*4+3]<20||(mn>228&&mx-mn<12)};
  const near=(i,j)=>Math.abs(p[i*4]-p[j*4])<=6&&Math.abs(p[i*4+1]-p[j*4+1])<=6&&Math.abs(p[i*4+2]-p[j*4+2])<=6;
  const q=new Int32Array(N);let h=0,t=0;
  for(let i=0;i<W;i++){for(const k of[i,(H-1)*W+i])if(!bg[k]&&light(k)){bg[k]=1;q[t++]=k}}
  for(let y=0;y<H;y++){for(const k of[y*W,y*W+W-1])if(!bg[k]&&light(k)){bg[k]=1;q[t++]=k}}
  const step=(i,f)=>{const y=(i/W)|0,xx=i%W;if(xx>0)f(i-1);if(xx<W-1)f(i+1);if(y>0)f(i-W);if(y<H-1)f(i+W)};
  while(h<t){const i=q[h++];step(i,j=>{if(!bg[j]&&light(j)&&near(i,j)){bg[j]=1;q[t++]=j}})}
  const seen=new Uint8Array(N),lim=Math.floor(H*0.35);
  for(let y0=0;y0<lim;y0++)for(let x0=0;x0<W;x0++){const s0=y0*W+x0;if(bg[s0]||seen[s0]||!light(s0))continue;
    h=0;t=0;q[t++]=s0;seen[s0]=1;let maxy=0;
    while(h<t){const i=q[h++];maxy=Math.max(maxy,(i/W)|0);step(i,j=>{if(!bg[j]&&!seen[j]&&light(j)){seen[j]=1;q[t++]=j}})}
    if(t>N*0.004&&maxy<lim)for(let k=0;k<t;k++)bg[q[k]]=1}
  let x1=W,y1=H,x2=0,y2=0;
  for(let i=0;i<N;i++){if(bg[i]){p[i*4+3]=0;continue}const y=(i/W)|0,xx=i%W;if(xx<x1)x1=xx;if(xx>x2)x2=xx;if(y<y1)y1=y;if(y>y2)y2=y}
  x.putImageData(d,0,0);const o=document.createElement('canvas');o.width=x2-x1+1;o.height=y2-y1+1;
  o.getContext('2d').drawImage(c,x1,y1,o.width,o.height,0,0,o.width,o.height);ok(o.toDataURL('image/png'))};im.src=src})}
(async()=>{const K=window.KR;const t=document.getElementById('t');t.textContent=K.name+' 키링';
  let f=100;while(t.scrollWidth>1000&&f>48){f-=4;t.style.fontSize=f+'px'}
  for(let i=0;i<3;i++)document.getElementById('i'+i).src=await cut(K.imgs[i]);
  await document.fonts.ready;document.title='ready'})();
</script></body></html>
